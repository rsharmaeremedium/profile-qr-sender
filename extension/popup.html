<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medxplain Profile ID Finder</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="icons/icon-192.png" alt="">
  <div class="titles">
    <h1>Profile ID Finder</h1>
    <p>Uses your logged-in Medxplain admin session.</p>
  </div>
  <button id="openTabBtn" class="link" type="button" title="Open in a full tab">Open in tab</button>
</header>

<main>
  <label class="field">
    <span>Email IDs</span>
    <textarea id="emails" rows="5" spellcheck="false"
      placeholder="one email per line&#10;doctor1@example.com&#10;doctor2@example.com"></textarea>
  </label>

  <div class="row">
    <button id="findBtn" class="primary" type="button">Find IDs</button>
    <button id="stopBtn" class="ghost" type="button" disabled>Stop</button>
    <button id="useAppBtn" class="ghost" type="button">Use emails from QR app</button>
  </div>

  <div id="status" class="status info">Ready.</div>
  <div class="progress"><div id="bar"></div></div>

  <div class="row small">
    <label class="delay">Delay
      <input id="delay" type="number" min="200" max="5000" step="100" value="700"> ms
    </label>
    <button id="openAdminBtn" class="link" type="button">Open admin tab</button>
  </div>

  <section id="resultsWrap" hidden>
    <div class="results-head">
      <h2>Results <span id="count"></span></h2>
      <button id="clearResultsBtn" class="link" type="button">Clear</button>
    </div>
    <div id="results" class="results"></div>
  </section>

  <div class="row actions">
    <button id="pushBtn" class="primary" type="button" disabled>Push IDs to QR app</button>
    <button id="copyBtn" class="ghost" type="button" disabled>Copy email,id</button>
    <button id="csvBtn" class="ghost" type="button" disabled>CSV</button>
  </div>

  <p class="note">
    Keep this popup open while it runs, or use <strong>Open in tab</strong>.
    The admin tab can stay in the background. If the admin asks you to log in,
    sign in there and run again.
  </p>
</main>

<script src="popup.js"></script>
</body>
</html>
